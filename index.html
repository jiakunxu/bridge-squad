<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073f48"><title>潮汐邮航</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#073b44;color:#183f40;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}body{min-height:100svh;display:grid;place-items:center;background-image:repeating-radial-gradient(ellipse at 80% 78%,transparent 0 62px,#91c3af16 63px 64px,transparent 65px 78px),linear-gradient(125deg,#133f41,#0e5158 53%,#06363f)}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ed763f;outline-offset:2px}button:active{transform:translateY(1px)}[hidden]{display:none!important}main{position:relative;width:min(100vw,440px);height:min(100svh,760px);min-height:320px;isolation:isolate;overflow:hidden;background:#187d80;box-shadow:0 20px 85px #052b33a6}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;top:max(13px,env(safe-area-inset-top));left:4.5%;right:4.5%;display:flex;align-items:center;gap:8px;pointer-events:none}.brand{margin-right:auto;font-weight:850;letter-spacing:.08em;font-size:15px;background:#fff2d9;color:#17474a;border-radius:18px;padding:6px 12px;box-shadow:0 2px #18494960}.round,.aux{border:1px solid #e5ddbb;background:#fff5dfed;padding:6px 12px;border-radius:18px;font-size:13px;font-weight:700;pointer-events:auto}.hud{position:absolute;top:max(58px,calc(env(safe-area-inset-top) + 48px));left:5%;right:5%;padding:9px 13px;border-radius:10px;background:#073f48e8;color:#fff1cc;font-size:14px}.stats{display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}.track{background:#528383;height:3px;margin-top:8px}.track i{display:block;height:100%;background:#ffc06b;width:0}.card{position:absolute;bottom:3.5%;left:5%;right:5%;background:#fff3d9;border-radius:4px 4px 12px 12px;padding:clamp(14px,2.6vh,24px);box-shadow:0 6px 0 #123f42,0 14px 28px #123f425c;max-height:81%;overflow:auto}.card:before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(-55deg,#d96b48 0 10px,#fff3d9 10px 21px,#317677 21px 31px,#fff3d9 31px 42px)}h1{font-family:"Songti SC","STSong",serif;font-size:clamp(31px,6vh,52px);letter-spacing:.08em;line-height:1.1;margin:6px 0 9px}p{font-size:14px;line-height:1.55;margin:6px 0 12px}.routes{display:flex;gap:4px;border-top:1px dashed #739b8c;padding-top:12px;margin-bottom:8px}.routes button{flex:1;min-width:0;border:1px solid #97b3a4;background:transparent;border-radius:5px;padding:8px 0;font-size:14px}.routes [aria-pressed=true]{background:#174f50;color:#fff2d4;border-color:#174f50}.meta{color:#45635b;font-size:13px;margin:8px 0 13px}.primary{width:100%;border:0;background:#c34726;color:white;font-weight:800;border-radius:6px;padding:11px;font-size:17px;box-shadow:0 3px 0 #813520}.secondary{display:block;border:0;background:transparent;margin:10px auto 0;text-decoration:underline;font-size:14px}.note{position:absolute;top:24%;left:0;right:0;text-align:center;color:#fff5d7;font-size:17px;font-weight:800;text-shadow:0 2px 4px #093f48;pointer-events:none}.foot{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff7df;font-size:13px;text-shadow:0 1px 2px #17484b}.foot .aux{touch-action:none;background:#ffedcc;color:#21494a;text-shadow:none}.foot .aux.on{background:#ffd38a}.foot span{background:#124f56ce;padding:5px 9px;border-radius:14px}@media(max-height:480px){.card{bottom:2%;max-height:73%}.card h1{font-size:27px}.card p,.meta{margin:3px 0}.routes{padding-top:6px}.top{top:5px}.hud{top:42px}}
</style>
<main><canvas id="sea" aria-label="邮船航道"></canvas>
<div class="top"><b class="brand">✉ 海岸邮务</b><button class="round" id="sound">声音开</button><button class="round" id="pause" hidden>暂停</button></div>
<div class="hud" hidden><div class="stats"><b id="score"></b><span id="cargo"></span><span id="hull"></span></div><div class="track"><i></i></div></div>
<div class="note" role="status"></div><div class="foot" hidden><span>左右拖动或按 A / D</span><button class="aux" id="brake">按住慢航</button></div>
<section class="card"><h1>潮汐邮航</h1><p></p><div class="routes" role="group" aria-label="选择航线"></div><div class="meta"></div><button class="primary"></button><button class="secondary" hidden></button></section></main>
<script>
'use strict';
const $=s=>document.querySelector(s), canvas=$('canvas'),g=canvas.getContext('2d');
const W=420,H=700,boatY=530,lanes=[86,210,334],paper='#fff0ce',ink='#19494b',orange='#e66b40';
const routes=[
 {name:'灯塔湾',place:'北岬灯塔',goal:3,speed:104,drift:6,color:'#137e83',rows:['B..','.b.','..P','.B.','b..','P..','..B','..b','.P.','B..','.b.','..P']},
 {name:'白沙汊',place:'白沙驿站',goal:4,speed:117,drift:19,color:'#287e77',rows:['..B','.b.','P.b','B..','b..','..P','.B.','..b','.P.','..B','b..','P..','.B.','..b','.P.']},
 {name:'雾隐港',place:'雾隐码头',goal:5,speed:129,drift:30,color:'#456f80',rows:['.B.','b..','..P','B..','..b','.P.','..B','bb.','P..','.B.','..b','b.P','B..','b.b','.P.','..B','.b.','P..']}
];
const $hud=$('.hud'),card=$('.card'),foot=$('.foot'),note=$('.note'),routeBar=$('.routes'),primary=$('.primary'),secondary=$('.secondary');
let chosen=0,mode='menu',run=null,clock=0,last=0,drag=null,target=null,braking=false,held=new Set(),audio=null,muted=false,feedback=0,wakes=[];
let records={};
try{const saved=JSON.parse(localStorage.getItem('tidemail-best-v1'));if(saved&&typeof saved==='object')records=saved;muted=localStorage.getItem('tidemail-muted')==='1'}catch{}
function save(k,v){try{localStorage.setItem(k,v)}catch{}}
function tone(hz,d=.14){if(muted||!audio||audio.state!=='running')return;const o=audio.createOscillator(),a=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.setValueAtTime(hz,t);o.frequency.exponentialRampToValueAtTime(hz*1.24,t+d);a.gain.setValueAtTime(.07,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(audio.destination);o.start();o.stop(t+d)}
function unlock(){if(muted)return;try{const A=window.AudioContext||window.webkitAudioContext;if(A){audio=audio||new A();if(audio.state==='suspended')audio.resume().catch(()=>{})}}catch{}}
function soundUI(){$('#sound').textContent=muted?'声音关':'声音开';$('#sound').setAttribute('aria-pressed',String(!muted))}
$('#sound').onclick=()=>{muted=!muted;soundUI();save('tidemail-muted',muted?'1':'0');unlock();tone(500)};soundUI();
function select(i){chosen=i;[...routeBar.children].forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));const r=routes[i];$('.meta').textContent=r.place+' · 目标 '+r.goal+' 袋 · 最佳 '+(Number(records[i])||0)+' 袋'}
routes.forEach((r,i)=>{const b=document.createElement('button');b.textContent=r.name;b.onclick=()=>select(i);routeBar.appendChild(b)});
function controlsClear(){held.clear();drag=null;target=null;braking=false;$('#brake').classList.remove('on')}
function ui(){const sailing=mode==='play',menu=mode==='menu',paused=mode==='pause';
 card.hidden=sailing;$hud.hidden=menu;foot.hidden=!sailing;$('#pause').hidden=!sailing;routeBar.hidden=!menu;$('.meta').hidden=!menu;secondary.hidden=sailing||menu;
 if(sailing)return;
 $('h1').textContent=menu?'潮汐邮航':paused?'航程暂停':run.win?'邮件送达':'航次未完成';
 $('.card p').textContent=menu?'捞起漂浮的黄色邮袋，驶近红色浮动邮筒投递。避开暗礁，满载时可一次交付三袋。':paused?'邮船已停航，回来后从这里继续。':(run.hp===0?'船体受损，已由拖船接回。':run.win?'灯塔已收到你的回执。':'邮船已进港，投递数量未达目标。')+' 本航次投递 '+run.sent+' / '+routes[chosen].goal+' 袋。';
 primary.textContent=menu?'开始投递':paused?'继续航行':run.win&&chosen<2?'驶向下一港':'再航一次';
 secondary.textContent='返回航线图';if(menu)select(chosen);
}
function start(){unlock();controlsClear();mode='play';wakes=[];const r=routes[chosen];const objects=[];
 r.rows.forEach((row,i)=>[...row].forEach((type,j)=>{if(type!=='.')objects.push({type,x:lanes[j],at:350+i*145,done:false})}));
 run={x:210,prevX:210,d:0,hp:3,load:0,sent:0,inv:0,objects,end:430+(r.rows.length-1)*145,win:false};note.textContent='黄色邮袋装船 · 红色邮筒投递';feedback=3;ui();stats();tone(390)}
function stats(){const r=routes[chosen];$('#score').textContent='已投 '+run.sent+' / '+r.goal;$('#cargo').textContent='船舱 '+run.load+' / 3';$('#hull').textContent='船体 '+'●'.repeat(run.hp)+'○'.repeat(3-run.hp);$('.track i').style.width=Math.min(100,run.d/run.end*100)+'%'}
function msg(s,hz){note.textContent=s;feedback=1.3;tone(hz)}
function finish(){mode='end';run.win=run.hp>0&&run.sent>=routes[chosen].goal;records[chosen]=Math.max(Number(records[chosen])||0,run.sent);save('tidemail-best-v1',JSON.stringify(records));controlsClear();note.textContent='';ui();tone(run.win?720:175)}
function pause(){if(mode!=='play')return;mode='pause';controlsClear();note.textContent='';ui()}
function resume(){mode='play';last=0;ui()}
primary.onclick=()=>{if(mode==='pause')return resume();if(mode==='end'&&run.win&&chosen<2)chosen++;start()};
secondary.onclick=()=>{mode='menu';run=null;wakes=[];note.textContent='';controlsClear();ui()};
$('#pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('blur',pause);
function step(dt){
 if(mode!=='play')return;
 const r=routes[chosen],old=run.d,dir=(held.has('arrowright')||held.has('d')?1:0)-(held.has('arrowleft')||held.has('a')?1:0);
 run.d+=r.speed*(braking||held.has(' ')?0.55:1)*dt;
 run.prevX=run.x;let steer=dir*270;if(target!==null&&!dir)steer=Math.max(-330,Math.min(330,(target-run.x)*10));
 run.x=Math.max(23,Math.min(397,run.x+(steer+r.drift*Math.sin(run.d/181))*dt));
 run.inv=Math.max(0,run.inv-dt);
 for(const o of run.objects){if(o.done||Math.abs(o.at-run.d)>32||Math.abs(o.x-run.x)>(o.type==='P'?43:29))continue;
  o.done=true;if(o.type==='B'){if(run.load<3){run.load++;msg('邮袋已装船',560)}else msg('船舱已满',300)}
  if(o.type==='P'){if(run.load){run.sent+=run.load;msg('已投递 '+run.load+' 袋',820);run.load=0}else msg('船舱空着呢',260)}
  if(o.type==='b'&&run.inv<=0){run.hp--;run.inv=1.15;msg('触礁！船体受损',115)}
  stats();if(!run.hp){finish();return}
 }
 if(Math.floor(run.d/5)!==Math.floor(old/5)){wakes.push({x:run.x,y:boatY+21,life:1});$('.track i').style.width=Math.min(100,run.d/run.end*100)+'%'}
 for(const w of wakes){w.y+=r.speed*dt*.8;w.life-=dt*.84}while(wakes.length&&wakes[0].life<=0)wakes.shift();
 if(feedback>0&&(feedback-=dt)<=0)note.textContent='';
 if(run.d>=run.end)finish()
}
const pos=e=>(e.clientX-canvas.getBoundingClientRect().left)*W/canvas.getBoundingClientRect().width;
canvas.onpointerdown=e=>{if(mode!=='play'||drag!==null)return;drag=e.pointerId;canvas.setPointerCapture(drag);target=pos(e)};
canvas.onpointermove=e=>{if(e.pointerId===drag)target=pos(e)};
canvas.onlostpointercapture=()=>{drag=null;target=null};canvas.onpointerup=canvas.onpointercancel=()=>{drag=null;target=null};
const brake=$('#brake');brake.onpointerdown=e=>{brake.setPointerCapture(e.pointerId);braking=true;brake.classList.add('on')};
brake.onlostpointercapture=brake.onpointerup=brake.onpointercancel=()=>{braking=false;brake.classList.remove('on')};
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='escape'&&!e.repeat){if(mode==='play')pause();else if(mode==='pause')resume();return}
 if(mode==='play'&&['arrowleft','arrowright','a','d',' '].includes(k)){e.preventDefault();held.add(k)}});
window.addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));
function poly(points,fill,stroke){g.beginPath();for(let i=0;i<points.length;i+=2)i?g.lineTo(points[i],points[i+1]):g.moveTo(points[i],points[i+1]);g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=1.4;g.stroke()}}
function line(x,y,X,Y,c,w=1){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=c;g.lineWidth=w;g.stroke()}
function ellipse(x,y,rx,ry,c){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=c;g.fill()}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function grad(top,bottom,y,h){const k=g.createLinearGradient(0,y,0,y,h);k.addColorStop(0,top);k.addColorStop(1,bottom);return k}
function pine(x,y,s){poly([x,y-25*s,x-7*s,y-7*s,x-4*s,y-8*s,x-10*s,y,x+8*s,y,x+3*s,y-8*s,x+6*s,y-7*s],'#2d6260')}
function lightHouse(x,y,s){g.save();g.translate(x,y);g.scale(s,s);
 poly([-9,0,-6,-45,6,-45,10,0],paper);poly([3,-45,6,-45,10,0,5,0],'#ccbb97');poly([-7,-32,7,-32,8,-22,-8,-22],orange);
 rect(-9,-49,18,4,ink);rect(-5,-59,10,10,'#ffcb76');line(-5,-59,-5,-49,ink,1.6);line(5,-59,5,-49,ink,1.6);
 poly([-10,-59,0,-67,10,-59],ink);rect(-2,-11,4,10,ink);g.restore()}
function horizon(){
 rect(0,0,W,217,grad('#e9b690','#ffe8b7',0,190));ellipse(99,91,32,32,'#fff0b5');
 for(let i=0;i<9;i++)rect((i*103)%420,52+(i*31)%81,19+i%4*10,2,'#fff0ce8c');
 poly([0,151,32,130,58,135,98,110,142,140,170,121,190,141,238,102,286,135,344,118,391,144,420,133,420,180,0,180],'#95b5a6');
 poly([0,170,49,147,95,155,149,131,196,145,241,134,291,157,363,130,420,147,420,184,0,184],'#64968c');
 rect(0,171,W,529,grad('#68b0a1','#166977',171,640));
 poly([215,168,250,159,264,140,282,146,300,134,321,137,345,121,373,124,397,111,420,117,420,182,295,187,226,177],'#427a70');
 poly([215,170,260,164,283,171,329,153,362,156,402,142,420,145,420,171,315,183,251,178],'#345f5d');
 for(let i=0;i<12;i++)pine(265+i*14,155-i*2+Math.sin(i)*4,.36+(i%4)*.13);
 lightHouse(333,148,.95);rect(291,151,14,8,'#ebe0b9');poly([287,152,298,144,309,152],orange);
 for(let i=0;i<10;i++)rect(233+(i*41)%189,178+(i*7)%29,12+i%4*8,1.3,'#d5e8d2aa');
 for(let i=0;i<4;i++){const x=156+i*13,y=76+Math.sin(i*2)*7;line(x-4,y-1,x,y+1,ink,1.3);line(x,y+1,x+4,y-2,ink,1.3)}
}
function waveField(d,menu){
 const top=menu?191:0,range=H-top;
 for(let i=0;i<100;i++){const x=(i*151+Math.sin(i+clock*.38)*5)%435-5,y=top+(i*61+d*.67)%range;
 const len=4+(i*13)%23;line(x,y,x+len,y-1,i%3?'#bbede627':'#d2f3d75c',i%4===0?1.6:1)}
}
function boat(x,y,lean=0,scale=1){
 g.save();g.translate(x,y);g.scale(scale,scale);g.rotate(lean);
 ellipse(4,8,16,31,'#073e4970');
 poly([0,-34,9,-24,15,-7,14,20,8,27,-9,27,-14,20,-15,-7,-9,-24],ink);
 poly([0,-30,8,-21,12,-7,11,18,6,23,-7,23,-11,18,-12,-7,-8,-21],'#f7e1ac');
 poly([0,-27,8,-15,-8,-15],orange);rect(-9,-6,18,20,'#c87546');rect(-10,-10,20,15,paper);
 rect(-7,-8,14,5,'#367b80');rect(-1,-8,2,5,'#e1e5ca');rect(-7,8,14,9,orange);line(-7,8,0,14,paper);line(0,14,7,8,paper);
 line(0,-15,0,-26,ink,1);poly([0,-27,9,-24,0,-22],orange);g.restore()
}
function item(o,y){const x=o.x,t=clock*2+x;
 g.save();g.translate(x,y);const bob=Math.sin(t)*1.8;
 if(o.type==='b'){
 ellipse(2,6,26,10,'#c7e8d48c');ellipse(0,5,23,8,'#407c77');
 poly([-23,5,-11,-10,-3,-7,5,-21,21,0,17,7,-8,10],'#375862');
 poly([5,-21,6,-4,21,0],'#87a9a1');poly([-11,-10,-7,2,-23,5],'#9eb4a5');
 }else if(o.type==='B'){
 ellipse(1,6,24+Math.sin(t),8,'#ade6cf77');ellipse(1,5,19,5,'#327a78');g.translate(0,bob);g.rotate(Math.sin(t)*.06);
 poly([-16,-8,-11,-15,10,-15,16,-8,13,7,-13,7],'#efb44b',ink);
 rect(-14,-9,28,12,'#ffcf70');line(-14,-9,0,0,ink,1.6);line(0,0,14,-9,ink,1.6);rect(-2,-1,4,4,orange)
 }else{
 ellipse(0,9,27,9,'#bce8cf88');g.translate(0,bob);ellipse(0,6,22,7,ink);ellipse(0,4,21,6,'#edd8ae');
 rect(-11,-18,22,21,orange);poly([-13,-18,-10,-24,10,-24,13,-18],paper);rect(-7,-16,14,3,ink);rect(-6,-9,12,8,paper);line(-6,-9,0,-5,ink);line(0,-5,6,-9,ink);
 line(11,-22,11,-40,ink,1.7);poly([12,-40,25,-36,12,-32],'#f5ba60')
 }g.restore()
}
function chart(d){rect(0,0,W,H,grad(routes[chosen].color,'#155f70',0,H));
 for(let i=0;i<8;i++){
 const y=(i*119+d*.8)%952-120,left=i%2===0,x=left?-8:428,sg=left?1:-1;
 poly([x,y-39,x+sg*9,y-31,x+sg*23,y-8,x+sg*17,y+2,x+sg*29,y+17,x,y+40],'#81b5a095');
 poly([x,y-32,x+sg*18,y-8,x+sg*11,y+7,x+sg*21,y+17,x,y+32],'#608d80');
 }
 waveField(d,false);
 const near=run.end-d;if(near<500){const y=boatY-near;
 rect(0,y-18,420,3,'#f3d58e');for(let i=0;i<21;i++)rect(i*20,y-18,8,3,ink);
 rect(0,y-46,55,21,'#ba996f');for(let j=4;j<55;j+=9)line(j,y-46,j,y-25,'#7b6955');lightHouse(32,y-44,.68)}
 for(const o of run.objects){const y=boatY+d-o.at;if(!o.done&&y>-45&&y<H+35)item(o,y)}
 for(const w of wakes){const a=1-w.life;g.globalAlpha=w.life*.68;line(w.x-5-a*15,w.y,w.x-10-a*18,w.y+3,paper,1.7);line(w.x+5+a*15,w.y,w.x+10+a*18,w.y+3,paper,1.7)}g.globalAlpha=1;
 if(run.inv<=0||Math.floor(run.inv*11)%2===0)boat(run.x,boatY,Math.max(-.19,Math.min(.19,(run.x-run.prevX)*.04)));
}
function draw(){if(mode==='menu'){horizon();waveField(clock*7,true);
 for(let i=0;i<20;i++){const y=280+i*5+clock*9%5;line(145-i*1.5,y,151-i*1.5,y-2,'#cce8c998',1.4);line(172+i*1.5,y,178+i*1.5,y-2,'#cce8c998',1.4)}
 boat(160,249+Math.sin(clock)*1.7,.10,1.35);item({type:'B',x:230},226)}else chart(run.d)}
function resize(){const b=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);canvas.width=Math.max(1,Math.round(b.width*d));canvas.height=Math.max(1,Math.round(b.height*d));g.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);g.lineCap='round'}
function frame(t){const dt=last?Math.min((t-last)/1000,.06):0;last=t;if(mode==='menu'||mode==='play')clock+=dt;step(dt);draw();requestAnimationFrame(frame)}
window.addEventListener('resize',resize);ui();resize();requestAnimationFrame(frame);
</script></main></html>
