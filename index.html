<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1838">
<meta name="description" content="率领小队穿过增援门、营救英雄、击败首领。两大关卡，支持触屏和键鼠操作。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%89%3C/text%3E%3C/svg%3E">
<title>桥头小队</title>
<style>
  html,body{margin:0;height:100%;height:100dvh;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0;width:100%;background:#000;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#0a1838;font-size:12px}
  #c{display:block;width:100%;height:100%}
  #ui{position:absolute;right:2%;top:1.4%;display:flex;gap:.28em;z-index:5}
  .ib{width:2.3em;height:2.3em;touch-action:manipulation;border-radius:.85em;border:.14em solid rgba(255,255,255,.92);background:linear-gradient(180deg,rgba(96,170,255,.82),rgba(24,66,180,.86));box-shadow:0 .2em 0 rgba(8,30,100,.95),0 .5em .8em rgba(0,0,0,.35),inset 0 .14em 0 rgba(255,255,255,.55);color:#fff;font:inherit;font-size:1em;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .08s}
  .ib:active{transform:translateY(.16em);box-shadow:0 .05em 0 rgba(8,30,100,.95),inset 0 .14em 0 rgba(255,255,255,.55)}
  a.ib{text-decoration:none;box-sizing:border-box}
  #bQual{width:auto;min-width:2.3em;padding:0 .5em;font-size:.78em}
  .ib svg{width:1.45em;height:1.45em;filter:drop-shadow(0 .08em 0 rgba(0,20,80,.6))}
  #hud{position:absolute;left:2%;top:1.4%;width:41%;z-index:5;pointer-events:none;display:flex;align-items:center;gap:.55em}
  #hudL{font-size:.86em;color:#fff;white-space:nowrap;padding:.32em .7em;border-radius:.8em;background:linear-gradient(180deg,rgba(96,170,255,.85),rgba(24,66,180,.9));border:.14em solid #fff;box-shadow:0 .18em 0 rgba(8,30,100,.95),inset 0 .12em 0 rgba(255,255,255,.5);text-shadow:0 .1em 0 rgba(0,20,80,.7);letter-spacing:.04em}
  #bar{flex:1;height:1.05em;border-radius:.6em;background:linear-gradient(180deg,rgba(4,12,40,.85),rgba(14,30,80,.8));border:.14em solid #fff;box-shadow:0 .18em 0 rgba(8,30,100,.9),0 .4em .6em rgba(0,0,0,.3);position:relative}
  #barF{height:100%;width:0;border-radius:.45em;background:linear-gradient(180deg,#b8f0ff,#3d98ff 55%,#1a56e0);box-shadow:inset 0 .16em 0 rgba(255,255,255,.65)}
  #barI{position:absolute;right:-.75em;top:50%;width:2em;height:2em;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a7a,#d0181f 60%,#8a0b14);border:.14em solid #fff;box-shadow:0 .16em 0 rgba(90,0,10,.9);display:flex;align-items:center;justify-content:center}
  #barI svg{width:1.3em;height:1.3em}
  #hint{position:absolute;left:0;right:0;bottom:1.2%;text-align:center;color:rgba(255,255,255,.72);font-size:.78em;letter-spacing:.04em;z-index:5;pointer-events:none;text-shadow:0 .1em .2em #000}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
  #ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:6;cursor:pointer;background:radial-gradient(ellipse at center,rgba(6,14,40,.2),rgba(4,10,32,.78))}
  #ov.show{display:flex}
  #ovt{font-size:5.4em;line-height:.95;letter-spacing:.02em;background:linear-gradient(180deg,#ffffff 18%,#cfeaff 52%,#69b4ff 90%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.09em #0b2a7a;paint-order:stroke fill;filter:drop-shadow(0 .07em 0 #0b2a7a) drop-shadow(0 .18em .22em rgba(0,0,0,.55));animation:drop .5s cubic-bezier(.2,1.5,.4,1) both}
  #ovt.win,#ovt.lose{font-size:4.5em}
  #ovt.win{background-image:linear-gradient(180deg,#fffbe0 15%,#ffe14a 50%,#ff9d0a 92%);-webkit-text-stroke-color:#8a3d00;filter:drop-shadow(0 .07em 0 #8a3d00) drop-shadow(0 .18em .22em rgba(0,0,0,.55)) drop-shadow(0 0 .5em rgba(255,200,60,.55))}
  #ovt.lose{background-image:linear-gradient(180deg,#ffd0c4 15%,#ff5142 50%,#c4121c 92%);-webkit-text-stroke-color:#4a0508;filter:drop-shadow(0 .07em 0 #4a0508) drop-shadow(0 .18em .22em rgba(0,0,0,.55))}
  #stars{display:none;font-size:3.4em;line-height:1;margin-bottom:.1em;letter-spacing:.12em}
  #stars.show{display:block}
  #stars span{display:inline-block;color:#3a4468;-webkit-text-stroke:.05em #fff;paint-order:stroke fill;filter:drop-shadow(0 .08em 0 rgba(0,0,0,.4))}
  #stars span.on{color:#ffd21f;-webkit-text-stroke-color:#8a3d00;filter:drop-shadow(0 .08em 0 #8a3d00) drop-shadow(0 0 .3em rgba(255,210,60,.8));animation:drop .45s cubic-bezier(.2,1.7,.4,1) both}
  #stars span:nth-child(2){animation-delay:.12s;transform:translateY(-.12em)}
  #stars span:nth-child(3){animation-delay:.24s}
  #ovs{margin-top:1em;font-size:1.2em;color:#fff;text-shadow:0 .12em .2em #000;max-width:86%;line-height:1.4}
  .chips{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin-top:.2em}
  .chip{padding:.4em .8em;border-radius:.9em;background:linear-gradient(180deg,rgba(40,70,150,.85),rgba(12,26,76,.9));border:.12em solid rgba(255,255,255,.85);box-shadow:0 .16em 0 rgba(0,0,0,.35),inset 0 .1em 0 rgba(255,255,255,.3);font-size:.86em;text-shadow:none}
  .chip b{display:block;font-size:1.5em;color:#ffe14a;text-shadow:0 .08em 0 rgba(0,0,0,.45)}
  #ovb{margin-top:1.4em;font:inherit;font-size:1.9em;color:#fff;background:linear-gradient(180deg,#7fd4ff,#2b8cff 48%,#155be8);border:.14em solid #fff;border-radius:.62em;padding:.45em 1.15em;cursor:pointer;box-shadow:0 .22em 0 #0b3ea8,0 .5em .7em rgba(0,0,0,.45),inset 0 .14em 0 rgba(255,255,255,.6);text-shadow:0 .08em 0 rgba(0,30,110,.8);animation:pulse 1s ease-in-out infinite}
  #ovh{margin-top:1.8em;font-size:.9em;color:rgba(255,255,255,.85);text-shadow:0 .1em .2em #000;line-height:1.6}
  @keyframes pulse{50%{transform:scale(1.07)}}
  @keyframes drop{0%{transform:scale(.2) translateY(-.6em);opacity:0}100%{transform:none;opacity:1}}
  #lv{display:none;gap:.6em;margin-top:1.1em;width:90%}
  #ov.menu #lv{display:flex}
  .lvb{flex:1;font:inherit;color:#fff;cursor:pointer;border:.16em solid rgba(255,255,255,.9);border-radius:1em;padding:.6em .3em .55em;background:linear-gradient(180deg,rgba(52,96,200,.9),rgba(14,34,104,.94));box-shadow:0 .25em 0 rgba(6,22,80,.95),0 .6em .9em rgba(0,0,0,.4),inset 0 .14em 0 rgba(255,255,255,.35);text-shadow:0 .08em 0 rgba(0,20,80,.8);transition:transform .1s}
  .lvb.sel{border-color:#ffe14a;background:linear-gradient(180deg,rgba(104,176,255,.96),rgba(26,74,196,.96));transform:translateY(-.18em) scale(1.03)}
  .lvb i{display:block;font-style:normal;font-size:.72em;letter-spacing:.14em;color:#cfe6ff}
  .lvb b{display:block;font-size:1.22em;line-height:1.05;margin:.2em 0 .25em}
  .lvb span{display:block;font-size:.6em;color:#dcebff;font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:.03em;text-shadow:none}
  .lvb em{display:block;font-style:normal;font-size:1.1em;letter-spacing:.12em;color:rgba(10,20,60,.6);margin-top:.25em;text-shadow:none}
  .lvb em u{text-decoration:none;color:#ffd21f;text-shadow:0 .06em 0 #8a3d00}
  #ovm{display:none;margin-top:.95em;font:inherit;font-size:1em;color:#fff;background:linear-gradient(180deg,rgba(60,90,170,.92),rgba(20,36,96,.94));border:.14em solid rgba(255,255,255,.85);border-radius:.7em;padding:.42em 1.1em;cursor:pointer;box-shadow:0 .18em 0 rgba(0,0,0,.4);letter-spacing:.06em}
  #ov.end #ovm{display:inline-block}
  #ovhome{margin-top:1.2em;color:#fff;font-size:.95em;text-decoration:none;padding:.7em 1.2em;border-radius:2em;border:.14em solid rgba(255,255,255,.7);background:rgba(10,24,64,.55);letter-spacing:.04em;order:9}
  body.clean #ui,body.clean #ovhome,body.clean #hud,body.clean #hint,body.clean #ovb,body.clean #ovh,body.clean #lv,body.clean #ovm{display:none!important}
  #unhide{position:absolute;right:0;top:0;width:14%;height:8%;z-index:7;display:none}

  #ltxt{font-size:14px;opacity:.85;letter-spacing:.08em}
  @keyframes ldp{50%{transform:scale(1.04)}}

  .lvb span{font-size:.75em}

<div id="load"><h1>桥头小队</h1><div id="lbar"><div id="lfill"></div></div><div id="ltxt">正在加载… 0%</div></div>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="flash"></div>
  <div id="hud"><div id="hudL">第 1 关</div><div id="bar"><div id="barF"></div><div id="barI"><svg viewBox="0 0 24 24"><path d="M5 4l3 6M19 4l-3 6" stroke="#fff0c8" stroke-width="3.2" stroke-linecap="round"/><circle cx="12" cy="14" r="6.5" fill="#fff"/><rect x="8" y="12.5" width="3" height="2.4" fill="#8a0b14"/><rect x="13" y="12.5" width="3" height="2.4" fill="#8a0b14"/></svg></div></div></div>
  <div id="ui">
    <a class="ib" id="bHome" href="https://noclipepe.pages.dev/" title="返回游戏大厅" aria-label="返回游戏大厅"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5.5 9.5V21h13V9.5"/></svg></a>
    <button class="ib" id="bQual" title="切换画质（Q）">低画质</button>
    <button class="ib" id="bMenu" title="选择关卡（L）"><svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg></button>
    <button class="ib" id="bMute" title="静音（M）"></button>
    <button class="ib" id="bRestart" title="重新开始（R）"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3v5h-5"/></svg></button>
    <button class="ib" id="bHide" title="隐藏界面（H）">H</button>
  </div>
  <div id="hint">拖动、移动鼠标或按 A / D 转向　·　H 隐藏界面　·　R 重开　·　L 选关</div>
  <div id="ov" class="show menu">
    <div id="stars"></div>
    <div id="ovt">桥头小队</div>
    <div id="ovs">穿过增援门壮大小队，救出笼中的英雄。<br>拾取火力补给箱，集中火力击败首领！</div>
    <div id="lv">
      <button class="lvb sel" data-l="1"><i>第 1 关</i><b>大桥突围</b><span>增援门 · 牢笼 · 激光</span><em id="lvs1"></em></button>
      <button class="lvb" data-l="2"><i>第 2 关</i><b>洪水救援</b><span>水泵 · 水箱 · 寒冰</span><em id="lvs2"></em></button>
    </div>
    <button id="ovb">开始游戏</button>
    <button id="ovm">选择关卡</button>
    <a id="ovhome" href="https://noclipepe.pages.dev/">&larr; 返回游戏大厅</a>
    <div id="ovh">拖动屏幕、移动鼠标或按 A / D 左右移动<br>H 隐藏界面　·　R 重新开始　·　1 / 2 选关</div>
  </div>
  <div id="unhide"></div>
</div>
<script>
(function(){
  var fill=document.getElementById('lfill'),txt=document.getElementById('ltxt'),ld=document.getElementById('load');
  function set(p){p=Math.max(0,Math.min(1,p));fill.style.width=Math.max(3,p*100)+'%';txt.textContent='正在加载… '+Math.round(p*100)+'%';}
  function fail(){txt.innerHTML='加载失败，点击重试';ld.onclick=function(){location.reload();};}
  window.onerror=function(){if(!ld.classList.contains('done'))fail();};
  function run(code){var s=document.createElement('script');s.textContent=code;document.head.appendChild(s);}
  window.__gameReady=function(){var n=0;set(1);(function w(){if(++n<24)return requestAnimationFrame(w);ld.classList.add('done');setTimeout(function(){ld.style.display='none';},500);})();};
  set(0.8);
  window.addEventListener('DOMContentLoaded', function () {
    requestAnimationFrame(function () {
      try { run(document.getElementById('main').textContent); }
      catch (error) { fail(); console.error(error); }
    });
  });
})();
</script>
